<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inkflow — Manga & Manhwa Reader</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08080f;--sur:#111118;--sur2:#181826;--sur3:#20202e;
  --bdr:#252535;--bdr2:#333348;
  --acc:#7c6af7;--acc2:#a594fa;--accbg:rgba(124,106,247,0.12);
  --tx:#eeeeff;--tx2:#9898b8;--tx3:#555570;
  --grn:#3ecf8e;--gld:#f0a429;
  --r:10px;--rl:16px;
}
html,body{min-height:100%;background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.6;overflow-x:hidden}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:4px}

/* topbar */
.bar{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:14px;padding:0 20px;height:56px;background:rgba(8,8,15,0.94);border-bottom:1px solid var(--bdr);backdrop-filter:blur(14px)}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;color:var(--tx);cursor:pointer;text-decoration:none;letter-spacing:-.5px;flex-shrink:0}
.logo em{color:var(--acc);font-style:normal}
.sw{flex:1;max-width:420px;position:relative}
#si{width:100%;height:36px;padding:0 12px 0 34px;background:var(--sur2);border:1px solid var(--bdr);border-radius:8px;color:var(--tx);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border-color .2s}
#si:focus{border-color:var(--acc)}
#si::placeholder{color:var(--tx3)}
.sico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--tx3);font-size:14px;pointer-events:none}
#sd{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--sur);border:1px solid var(--bdr2);border-radius:var(--r);overflow:hidden;max-height:380px;overflow-y:auto;z-index:200;display:none;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.di{display:flex;align-items:center;gap:10px;padding:10px 13px;cursor:pointer;transition:background .15s;border-bottom:1px solid var(--bdr)}
.di:last-child{border-bottom:none}
.di:hover{background:var(--sur2)}
.dth{width:32px;height:46px;object-fit:cover;border-radius:4px;flex-shrink:0;background:var(--sur2)}
.din p{font-size:13px;font-weight:500;line-height:1.3;color:var(--tx)}
.din small{font-size:11px;color:var(--tx3)}
.ntabs{display:flex;gap:2px;margin-left:auto}
.nt{padding:5px 13px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;color:var(--tx2);transition:all .15s;border:none;background:none;font-family:'DM Sans',sans-serif}
.nt:hover{color:var(--tx);background:var(--sur2)}
.nt.on{color:var(--acc2);background:var(--accbg)}

/* main */
main{padding:20px 20px}
.sech{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sect{font-family:'Syne',sans-serif;font-weight:700;font-size:17px}
.sa{font-size:12px;color:var(--acc2);cursor:pointer;opacity:.8;transition:opacity .15s;text-decoration:none}
.sa:hover{opacity:1}

/* grid */
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:28px}
@media(max-width:960px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}

/* card */
.mc{cursor:pointer}
.mci{border-radius:var(--r);overflow:hidden;aspect-ratio:2/3;background:var(--sur2);position:relative;border:1px solid var(--bdr);transition:border-color .2s,transform .2s}
.mc:hover .mci{border-color:var(--acc);transform:translateY(-3px)}
.mc img{width:100%;height:100%;object-fit:cover;display:block}
.mov{position:absolute;inset:0;background:linear-gradient(to top,rgba(4,4,10,.95) 0%,rgba(4,4,10,.25) 55%,transparent 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:8px}
.mtt{font-family:'Syne',sans-serif;font-size:11px;font-weight:600;color:#fff;line-height:1.3;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{display:inline-flex;align-items:center;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600}
.bm{background:rgba(124,106,247,.22);color:#a594fa;border:1px solid rgba(124,106,247,.35)}
.bmh{background:rgba(62,207,142,.15);color:#3ecf8e;border:1px solid rgba(62,207,142,.3)}
.bmc{background:rgba(240,164,41,.15);color:#f0a429;border:1px solid rgba(240,164,41,.3)}

/* updates */
.ul{display:flex;flex-direction:column;gap:6px}
.ur{display:flex;align-items:center;gap:12px;padding:9px 13px;border-radius:var(--r);background:var(--sur);border:1px solid var(--bdr);cursor:pointer;transition:border-color .2s,background .2s}
.ur:hover{border-color:var(--bdr2);background:var(--sur2)}
.uth{width:38px;height:53px;object-fit:cover;border-radius:5px;flex-shrink:0;background:var(--sur2)}
.ui{flex:1;min-width:0}
.utt{font-weight:500;font-size:13px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uc{font-size:12px;color:var(--acc2);margin-top:1px}
.ut{font-size:11px;color:var(--tx3);flex-shrink:0}

/* detail */
#dp{display:none}
.dh{display:flex;gap:22px;margin-bottom:26px}
.dcv{width:160px;flex-shrink:0;border-radius:var(--rl);overflow:hidden;border:1px solid var(--bdr);aspect-ratio:2/3;background:var(--sur2)}
.dcv img{width:100%;height:100%;object-fit:cover}
.din2{flex:1;min-width:0}
.dtt{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;line-height:1.2;margin-bottom:7px}
.dm{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px}
.dd{font-size:13px;color:var(--tx2);line-height:1.7;margin-bottom:13px;max-height:105px;overflow-y:auto}
.dbs{display:flex;gap:7px;flex-wrap:wrap}
.db{display:inline-flex;align-items:center;gap:5px;padding:7px 15px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;border:1px solid var(--bdr2);color:var(--tx2);background:var(--sur2)}
.db.p{background:var(--acc);border-color:var(--acc);color:#fff}
.db.p:hover{background:#6c5ae0}
.db:hover:not(.p){border-color:var(--acc);color:var(--acc2);background:var(--accbg)}
.chh{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.cht{font-family:'Syne',sans-serif;font-weight:700;font-size:15px}
.sb{padding:5px 11px;border-radius:6px;font-size:12px;background:var(--sur2);border:1px solid var(--bdr);color:var(--tx2);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.sb:hover{border-color:var(--bdr2);color:var(--tx)}
.chl{display:flex;flex-direction:column;gap:3px;max-height:400px;overflow-y:auto;padding-right:4px}
.cr{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:7px;background:var(--sur);border:1px solid var(--bdr);cursor:pointer;transition:border-color .15s,background .15s}
.cr:hover{border-color:var(--acc);background:var(--sur2)}
.cn{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;color:var(--acc2);min-width:70px}
.ctit{flex:1;font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd{font-size:11px;color:var(--tx3);flex-shrink:0}

/* reader */
#rp{display:none;background:var(--bg);min-height:100vh}
.rtb{display:flex;align-items:center;gap:10px;padding:0 14px;height:50px;background:rgba(8,8,15,.94);border-bottom:1px solid var(--bdr);position:sticky;top:0;z-index:50;backdrop-filter:blur(10px)}
.rbk{display:flex;align-items:center;gap:5px;color:var(--tx2);cursor:pointer;font-size:13px;border:none;background:none;font-family:'DM Sans',sans-serif;transition:color .15s;padding:0}
.rbk:hover{color:var(--tx)}
.rttl{font-family:'Syne',sans-serif;font-weight:600;font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rci{font-size:12px;color:var(--tx3);flex-shrink:0}
.mtg{display:flex;background:var(--sur2);border-radius:6px;border:1px solid var(--bdr);overflow:hidden}
.mb{padding:5px 11px;font-size:12px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--tx3);font-family:'DM Sans',sans-serif;transition:all .15s}
.mb.on{background:var(--acc);color:#fff}
.rnv{display:flex;gap:3px}
.rn{padding:5px 11px;border-radius:6px;font-size:12px;font-weight:500;background:var(--sur2);border:1px solid var(--bdr);color:var(--tx2);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.rn:hover:not(:disabled){border-color:var(--acc);color:var(--acc2)}
.rn:disabled{opacity:.3;cursor:not-allowed}
#sr{padding:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
.spage{width:100%;max-width:800px;display:block;background:var(--sur)}
#pr{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 50px);padding:12px}
.pw{position:relative;max-width:800px;width:100%}
#pi{width:100%;display:block;background:var(--sur);min-height:400px}
.pn{position:absolute;top:0;bottom:0;width:40%;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .15s}
.pn:hover{opacity:1}
.pnl{left:0;background:linear-gradient(to right,rgba(0,0,0,.28),transparent)}
.pnr{right:0;background:linear-gradient(to left,rgba(0,0,0,.28),transparent)}
.pa{font-size:30px;color:rgba(255,255,255,.75)}
.pc{text-align:center;margin-top:8px;font-size:12px;color:var(--tx3)}

/* genre bar */
.gb{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none}
.gb::-webkit-scrollbar{display:none}
.gc{padding:4px 13px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap;cursor:pointer;transition:all .15s;flex-shrink:0;border:1px solid var(--bdr);background:var(--sur);color:var(--tx2)}
.gc:hover{border-color:var(--bdr2);color:var(--tx)}
.gc.on{background:var(--acc);border-color:var(--acc);color:#fff}

/* tabs */
.tbar{display:flex;border-bottom:1px solid var(--bdr);margin-bottom:18px}
.tab{padding:8px 16px;font-size:13px;font-weight:500;cursor:pointer;color:var(--tx3);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;border-top:none;border-left:none;border-right:none;background:none;font-family:'DM Sans',sans-serif}
.tab:hover{color:var(--tx2)}
.tab.on{color:var(--acc2);border-bottom-color:var(--acc)}

/* util */
.spin{display:inline-block;width:20px;height:20px;border:2px solid var(--bdr2);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.lw{display:flex;align-items:center;justify-content:center;gap:10px;padding:36px;color:var(--tx3);font-size:13px}
.emp{text-align:center;padding:48px 20px;color:var(--tx3);font-size:13px}
.bk{display:inline-flex;align-items:center;gap:5px;margin-bottom:16px;font-size:13px;color:var(--tx2);cursor:pointer;background:none;border:none;font-family:'DM Sans',sans-serif;transition:color .15s;padding:0}
.bk:hover{color:var(--acc2)}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.shim{background:linear-gradient(90deg,var(--sur2) 25%,var(--sur3) 50%,var(--sur2) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}
</style>
</head>
<body>

<nav class="bar">
  <a class="logo" href="#" onclick="goHome();return false;">Ink<em>flow</em></a>
  <div class="sw">
    <span class="sico">🔍</span>
    <input id="si" type="text" placeholder="Search manga, manhwa, manhua…" autocomplete="off">
    <div id="sd"></div>
  </div>
  <div class="ntabs">
    <button class="nt on" onclick="switchTab('home',this)">Home</button>
    <button class="nt" onclick="switchTab('browse',this)">Browse</button>
    <button class="nt" onclick="switchTab('updates',this)">Updates</button>
  </div>
</nav>

<!-- HOME -->
<div id="hp">
  <main>
    <div class="tbar">
      <button class="tab on" onclick="htab('popular',this)">🔥 Popular</button>
      <button class="tab" onclick="htab('new',this)">🕐 New Releases</button>
      <button class="tab" onclick="htab('top',this)">⭐ Top Rated</button>
    </div>
    <div class="sech"><h2 class="sect">Featured</h2></div>
    <div id="hg" class="grid"><div class="lw"><div class="spin"></div> Loading…</div></div>
    <div class="sech" style="margin-top:26px">
      <h2 class="sect">Latest Updates</h2>
      <a class="sa" href="#" onclick="toUpdates();return false;">See all →</a>
    </div>
    <div id="hu" class="ul"><div class="lw"><div class="spin"></div> Loading…</div></div>
  </main>
</div>

<!-- BROWSE -->
<div id="bp" style="display:none">
  <main>
    <div class="gb">
      <span class="gc on" onclick="gfilt('',this)">All</span>
      <span class="gc" onclick="gfilt('Action',this)">Action</span>
      <span class="gc" onclick="gfilt('Adventure',this)">Adventure</span>
      <span class="gc" onclick="gfilt('Comedy',this)">Comedy</span>
      <span class="gc" onclick="gfilt('Drama',this)">Drama</span>
      <span class="gc" onclick="gfilt('Fantasy',this)">Fantasy</span>
      <span class="gc" onclick="gfilt('Horror',this)">Horror</span>
      <span class="gc" onclick="gfilt('Mystery',this)">Mystery</span>
      <span class="gc" onclick="gfilt('Romance',this)">Romance</span>
      <span class="gc" onclick="gfilt('Sci-Fi',this)">Sci-Fi</span>
      <span class="gc" onclick="gfilt('Slice of Life',this)">Slice of Life</span>
      <span class="gc" onclick="gfilt('Sports',this)">Sports</span>
      <span class="gc" onclick="gfilt('Supernatural',this)">Supernatural</span>
      <span class="gc" onclick="gfilt('Thriller',this)">Thriller</span>
    </div>
    <div id="bg" class="grid"><div class="lw"><div class="spin"></div> Loading…</div></div>
    <div id="bmore" style="text-align:center;margin-top:18px;display:none">
      <button class="db" onclick="browseMore()">Load more</button>
    </div>
  </main>
</div>

<!-- UPDATES -->
<div id="up" style="display:none">
  <main>
    <div class="sech">
      <h2 class="sect">Latest Chapter Updates</h2>
      <button class="db" style="font-size:12px;padding:5px 12px" onclick="loadUpdates()">↺ Refresh</button>
    </div>
    <div id="ul" class="ul"><div class="lw"><div class="spin"></div> Loading…</div></div>
  </main>
</div>

<!-- DETAIL -->
<div id="dp">
  <main>
    <button class="bk" onclick="goBack()">← Back</button>
    <div class="dh">
      <div class="dcv"><img id="dcv" src="" alt=""></div>
      <div class="din2">
        <h1 class="dtt" id="dtt">Loading…</h1>
        <div class="dm" id="dm"></div>
        <p class="dd" id="dd"></p>
        <div class="dbs" id="dbs"></div>
      </div>
    </div>
    <div class="chh">
      <span class="cht" id="cht">Chapters</span>
      <button class="sb" onclick="togSort()" id="sb">↑ Newest first</button>
    </div>
    <div id="chl" class="chl"><div class="lw"><div class="spin"></div> Loading…</div></div>
  </main>
</div>

<!-- READER -->
<div id="rp">
  <div class="rtb">
    <button class="rbk" onclick="closeReader()">← Back</button>
    <span class="rttl" id="rttl">—</span>
    <span class="rci" id="rci"></span>
    <div class="mtg">
      <button class="mb on" id="ms" onclick="setMode('scroll')">Scroll</button>
      <button class="mb" id="mpg" onclick="setMode('page')">Pages</button>
    </div>
    <div class="rnv">
      <button class="rn" id="pb" onclick="navCh(-1)">‹ Prev</button>
      <button class="rn" id="nb" onclick="navCh(1)">Next ›</button>
    </div>
  </div>
  <div id="sr"></div>
  <div id="pr" style="display:none">
    <div class="pw">
      <img id="pi" src="" alt="Page">
      <div class="pn pnl" onclick="prevPg()"><span class="pa">‹</span></div>
      <div class="pn pnr" onclick="nextPg()"><span class="pa">›</span></div>
    </div>
    <p class="pc" id="pc"></p>
  </div>
  <div id="rl" class="lw" style="display:none"><div class="spin"></div> Loading pages…</div>
</div>

<script>
/* ── CORS PROXIES ───────────────────────────────── */
const PROXIES=[
  'https://corsproxy.io/?',
  'https://api.allorigins.win/raw?url=',
  'https://thingproxy.freeboard.io/fetch/'
];
let bestProxy=null;

async function pFetch(url){
  if(bestProxy){
    try{
      const r=await fetch(bestProxy+encodeURIComponent(url),{signal:AbortSignal.timeout(10000)});
      if(r.ok)return r;
    }catch{bestProxy=null;}
  }
  for(const p of PROXIES){
    try{
      const r=await fetch(p+encodeURIComponent(url),{signal:AbortSignal.timeout(10000)});
      if(r.ok){bestProxy=p;return r;}
    }catch{}
  }
  throw new Error('All proxies failed');
}
async function pJSON(url){const r=await pFetch(url);return r.json();}

/* ── STATE ──────────────────────────────────────── */
const MDEX='https://api.mangadex.org';
const COMICK='https://api.comick.fun';
const CONSUMET='https://api.consumet.org';

let curManga=null,curChapters=[],curChIdx=0;
let pages=[],curPg=0,rMode='scroll';
let prevPage='home',hMode='popular';
let bOff=0,bPage=1,bGenre='',bGenreId='';
let sortAsc=false,tagMap={};
let refreshTimer=null,searchTimer=null;

/* ── HELPERS ────────────────────────────────────── */
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function rt(iso){
  if(!iso)return'';
  const d=Date.now()-new Date(iso).getTime(),m=Math.floor(d/60000);
  if(m<1)return'just now';if(m<60)return m+'m ago';
  const h=Math.floor(m/60);if(h<24)return h+'h ago';
  const dy=Math.floor(h/24);if(dy<30)return dy+'d ago';
  return new Date(iso).toLocaleDateString();
}
function tbadge(lang){
  const mp={'ja':['manga','bm'],'ko':['manhwa','bmh'],'zh':['manhua','bmc'],'zh-hk':['manhua','bmc']};
  const[l,c]=mp[lang]||['manga','bm'];
  return`<span class="badge ${c}">${l}</span>`;
}
function norm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,30)}
function dedup(arr){
  const seen=new Set();
  return arr.filter(i=>{const k=norm(i.title);if(seen.has(k))return false;seen.add(k);return true;});
}

/* ── MANGADEX ───────────────────────────────────── */
async function mdFetch(path){return pJSON(MDEX+path);}
function mdCov(m,sz='256'){
  const r=(m.relationships||[]).find(r=>r.type==='cover_art');
  if(!r?.attributes?.fileName)return'';
  return`https://uploads.mangadex.org/covers/${m.id}/${r.attributes.fileName}.${sz}.jpg`;
}
function mdTit(m){
  const t=m.attributes?.title||{};
  return t.en||t['ja-ro']||t.ja||t.ko||Object.values(t)[0]||'Unknown';
}
function mdToCard(m){
  return{id:'md:'+m.id,rawId:m.id,src:'md',title:mdTit(m),cover:mdCov(m,'512'),lang:m.attributes?.originalLanguage,status:m.attributes?.status||''};
}
async function mdFeatured(mode){
  const ord=mode==='popular'?'followedCount':mode==='top'?'rating':'createdAt';
  const d=await mdFetch(`/manga?limit=18&includes[]=cover_art&contentRating[]=safe&contentRating[]=suggestive&availableTranslatedLanguage[]=en&order[${ord}]=desc`).catch(()=>null);
  return d?.data?.map(mdToCard)||[];
}
async function mdUpdates(){
  const d=await mdFetch('/chapter?limit=40&translatedLanguage[]=en&order[publishAt]=desc&includes[]=manga&contentRating[]=safe&contentRating[]=suggestive').catch(()=>null);
  if(!d?.data)return[];
  const seen=new Set(),rows=[];
  for(const c of d.data){
    const mr=(c.relationships||[]).find(r=>r.type==='manga');
    if(!mr)continue;
    const k=mr.id+':'+c.attributes.chapter;
    if(seen.has(k))continue;seen.add(k);
    rows.push({mangaId:mr.id,chId:c.id,rawChId:c.id,chNum:c.attributes.chapter,chTitle:c.attributes.title||'',time:c.attributes.publishAt,src:'md',_mr:mr});
  }
  const ids=[...new Set(rows.map(r=>r.mangaId))];
  const md=await mdFetch('/manga?ids[]='+ids.slice(0,20).join('&ids[]=')+'&includes[]=cover_art&limit=20').catch(()=>null);
  const mm={};(md?.data||[]).forEach(m=>mm[m.id]=m);
  return rows.map(r=>{const m=mm[r.mangaId]||r._mr;return{...r,title:mdTit(m),cover:mdCov(m,'128')};});
}
async function mdSearch(q){
  const d=await mdFetch(`/manga?title=${encodeURIComponent(q)}&limit=5&includes[]=cover_art&contentRating[]=safe&contentRating[]=suggestive&availableTranslatedLanguage[]=en`).catch(()=>null);
  return d?.data?.map(mdToCard)||[];
}
async function mdBrowse(off,gid){
  let url=`/manga?limit=18&offset=${off}&includes[]=cover_art&contentRating[]=safe&contentRating[]=suggestive&availableTranslatedLanguage[]=en&order[followedCount]=desc`;
  if(gid)url+=`&includedTags[]=${gid}`;
  const d=await mdFetch(url).catch(()=>null);
  return d?.data?.map(mdToCard)||[];
}
async function mdDetail(id){
  const d=await mdFetch(`/manga/${id}?includes[]=cover_art&includes[]=author`).catch(()=>null);
  if(!d?.data)return null;
  const m=d.data;
  return{id:'md:'+m.id,rawId:m.id,src:'md',title:mdTit(m),cover:mdCov(m,'512'),
    lang:m.attributes?.originalLanguage,status:m.attributes?.status||'',year:m.attributes?.year||'',
    desc:m.attributes?.description?.en||Object.values(m.attributes?.description||{})[0]||'',
    author:(m.relationships||[]).find(r=>r.type==='author')?.attributes?.name||'Unknown'};
}
async function mdChapters(id){
  let all=[],off=0;
  while(true){
    const d=await mdFetch(`/manga/${id}/feed?limit=96&offset=${off}&translatedLanguage[]=en&order[chapter]=desc&contentRating[]=safe&contentRating[]=suggestive`).catch(()=>null);
    if(!d?.data?.length)break;
    all=all.concat(d.data);
    if(d.data.length<96)break;
    off+=96;if(off>960)break;
  }
  const seen={};
  for(const c of all){const n=c.attributes.chapter||'0';if(!seen[n])seen[n]=c;}
  return Object.values(seen).map(c=>({id:c.id,rawId:c.id,src:'md',num:c.attributes.chapter,title:c.attributes.title||'',date:c.attributes.publishAt}));
}
async function mdPages(id){
  const d=await mdFetch(`/at-home/server/${id}`).catch(()=>null);
  if(!d?.chapter)return[];
  const{baseUrl,chapter:{hash,dataSaver,data}}=d;
  const pg=dataSaver||data,folder=dataSaver?'data-saver':'data';
  return pg.map(p=>`${baseUrl}/${folder}/${hash}/${p}`);
}

function csToCard(m,provider){

async function allFeatured(mode){
  const[a,b,c]=await Promise.allSettled([mdFeatured(mode),ckFeatured(),csFeatured()]);
  return dedup([
    ...(a.status==='fulfilled'?a.value:[]),
    ...(b.status==='fulfilled'?b.value:[]),
    ...(c.status==='fulfilled'?c.value:[])
  ]);
}
async function allUpdates(){
  const[a,b,c]=await Promise.allSettled([mdUpdates(),ckUpdates(),csUpdates()]);
  return[
    ...(a.status==='fulfilled'?a.value:[]),
    ...(b.status==='fulfilled'?b.value:[]),
    ...(c.status==='fulfilled'?c.value:[])
  ].sort((x,y)=>new Date(y.time||0)-new Date(x.time||0)).slice(0,60);
}
async function allSearch(q){
  const[a,b,c]=await Promise.allSettled([mdSearch(q),ckSearch(q),csSearch(q)]);
  return dedup([
    ...(a.status==='fulfilled'?a.value:[]),
    ...(b.status==='fulfilled'?b.value:[]),
    ...(c.status==='fulfilled'?c.value:[])
  ]);
}
async function allBrowse(mdOff,ckPg,gid,genre){
  const[a,b,c]=await Promise.allSettled([mdBrowse(mdOff,gid),ckBrowse(ckPg,genre),csBrowse()]);
  return dedup([
    ...(a.status==='fulfilled'?a.value:[]),
    ...(b.status==='fulfilled'?b.value:[]),
    ...(c.status==='fulfilled'?c.value:[])
  ]);
}

/* ── DETAIL ─────────────────────────────────────── */
async function showDetail(id){
  hideAll();
  document.getElementById('dp').style.display='block';
  prevPage=getCur()||'home';
  document.getElementById('dtt').textContent='Loading…';
  ['dm','dd','dbs'].forEach(i=>document.getElementById(i).innerHTML='');
  document.getElementById('chl').innerHTML='<div class="lw"><div class="spin"></div> Loading…</div>';
  document.getElementById('cht').textContent='Chapters';

  const parts=id.split(':');
  const src=parts[0];
  let detail=null;
  if(src==='md')detail=await mdDetail(parts[1]);
  else if(src==='ck')detail=await ckDetail(parts[1]);
  else if(src==='cs')detail=await csDetail(parts[1],parts.slice(2).join(':'));
  if(!detail){document.getElementById('dtt').textContent='Failed to load.';return;}
  curManga=detail;
  document.title=detail.title+' — Inkflow';
  document.getElementById('dtt').textContent=detail.title;
  document.getElementById('dcv').src=detail.cover;
  document.getElementById('dd').textContent=detail.desc||'No description available.';
  document.getElementById('dm').innerHTML=
    tbadge(detail.lang)+
    `<span class="badge" style="background:var(--sur2);border:1px solid var(--bdr);color:var(--tx2)">${detail.status}</span>`+
    (detail.year?`<span class="badge" style="background:var(--sur2);border:1px solid var(--bdr);color:var(--tx2)">${detail.year}</span>`:'');

  let chs=[];
  if(src==='md')chs=await mdChapters(parts[1]);
  else if(src==='ck')chs=await ckChapters(parts[1]);
  else if(src==='cs')chs=await csChapters(parts[1],parts.slice(2).join(':'));
  curChapters=chs.sort((a,b)=>parseFloat(b.num||0)-parseFloat(a.num||0));
  renderChs();
  document.getElementById('cht').textContent=`${curChapters.length} Chapters`;
  const first=curChapters[curChapters.length-1];
  document.getElementById('dbs').innerHTML=first
    ?`<button class="db p" onclick="openCh(${curChapters.length-1})">▶ Start Reading</button>`:'';
}
function renderChs(){
  const el=document.getElementById('chl');
  if(!curChapters.length){el.innerHTML='<div class="emp">No chapters found.</div>';return;}
  const list=sortAsc?[...curChapters].reverse():curChapters;
  el.innerHTML=list.map((c,i)=>{
    const idx=sortAsc?curChapters.length-1-i:i;
    const num=c.num?`Ch. ${c.num}`:'Oneshot';
    return`<div class="cr" onclick="openCh(${idx})">
      <span class="cn">${esc(num)}</span>
      <span class="ctit">${esc(c.title)||'&nbsp;'}</span>
      <span class="cd">${rt(c.date)}</span>
    </div>`;
  }).join('');
}
function togSort(){
  sortAsc=!sortAsc;
  document.getElementById('sb').textContent=sortAsc?'↓ Oldest first':'↑ Newest first';
  renderChs();
}

/* ── READER ─────────────────────────────────────── */
async function openCh(idx){
  curChIdx=idx;
  const ch=curChapters[idx];if(!ch)return;
  showReader();
  document.getElementById('rttl').textContent=curManga?.title||'';
  document.getElementById('rci').textContent=ch.num?`Ch. ${ch.num}`:'Oneshot';
  navBtns();
  await loadPages(ch);
}
function navBtns(){
  document.getElementById('pb').disabled=curChIdx>=curChapters.length-1;
  document.getElementById('nb').disabled=curChIdx<=0;
}
async function loadPages(ch){
  document.getElementById('sr').innerHTML='';
  document.getElementById('rl').style.display='flex';
  let pg=[];
  if(ch.src==='md')pg=await mdPages(ch.rawId).catch(()=>[]);
  else if(ch.src==='ck')pg=await ckPages(ch.rawId).catch(()=>[]);
  else if(ch.src==='cs')pg=await csPages(ch.provider,ch.rawId).catch(()=>[]);
  // fallback: proxy the MD images if they came back but may be blocked
  if(!pg.length&&ch.src==='md'){
    const d=await mdFetch(`/at-home/server/${ch.rawId}`).catch(()=>null);
    if(d?.chapter){
      const{baseUrl,chapter:{hash,dataSaver,data}}=d;
      const files=dataSaver||data,folder=dataSaver?'data-saver':'data';
      pg=files.map(p=>`https://corsproxy.io/?${encodeURIComponent(`${baseUrl}/${folder}/${hash}/${p}`)}`);
    }
  }
  document.getElementById('rl').style.display='none';
  if(!pg.length){
    const mdLink=ch.src==='md'?`https://mangadex.org/chapter/${ch.rawId}`:'';
    document.getElementById('sr').style.display='flex';
    document.getElementById('sr').innerHTML=`<div style="text-align:center;padding:60px 20px;max-width:480px;margin:0 auto">
      <div style="font-size:36px;margin-bottom:14px;opacity:.3">📖</div>
      <p style="font-size:15px;font-weight:500;margin-bottom:8px">Chapter unavailable here</p>
      <p style="color:var(--tx2);font-size:13px;line-height:1.7;margin-bottom:18px">This chapter requires a login or is licensed. Try reading it on the original site.</p>
      ${mdLink?`<a href="${mdLink}" target="_blank" rel="noopener" style="display:inline-block;padding:9px 18px;background:var(--acc);color:#fff;border-radius:8px;text-decoration:none;font-size:13px;font-weight:500">Read on MangaDex →</a>`:''}
    </div>`;
    return;
  }
  pages=pg;curPg=0;
  renderReader();
}
function renderReader(){
  if(rMode==='scroll'){
    document.getElementById('sr').style.display='flex';
    document.getElementById('pr').style.display='none';
    document.getElementById('sr').innerHTML=pages.map((p,i)=>`<img class="spage shim" src="${esc(p)}" alt="Page ${i+1}" loading="lazy" onload="this.classList.remove('shim')" onerror="if(!this.dataset.tried){this.dataset.tried=1;this.src='https://corsproxy.io/?'+encodeURIComponent(this.src)}">`).join('');
  }else{
    document.getElementById('sr').style.display='none';
    document.getElementById('pr').style.display='flex';
    showPg(0);
  }
}
function showPg(n){
  curPg=Math.max(0,Math.min(n,pages.length-1));
  const img=document.getElementById('pi');
  img.src=pages[curPg];img.classList.add('shim');
  img.onload=()=>img.classList.remove('shim');
  img.onerror=function(){if(!this.dataset.tried){this.dataset.tried=1;this.src='https://corsproxy.io/?'+encodeURIComponent(pages[curPg]);}};
  document.getElementById('pc').textContent=`${curPg+1} / ${pages.length}`;
}
function prevPg(){showPg(curPg-1);}
function nextPg(){showPg(curPg+1);}
function setMode(m){
  rMode=m;
  document.getElementById('ms').classList.toggle('on',m==='scroll');
  document.getElementById('mpg').classList.toggle('on',m==='page');
  renderReader();
}
function navCh(dir){
  const ni=curChIdx-dir;
  if(ni>=0&&ni<curChapters.length)openCh(ni);
}
async function openUpdate(src,rawMangaId,rawChId,provider){
  rawMangaId=decodeURIComponent(rawMangaId);
  rawChId=decodeURIComponent(rawChId);
  provider=decodeURIComponent(provider);
  showReader();
  document.getElementById('rttl').textContent='Loading…';
  document.getElementById('rl').style.display='flex';
  const fullId=src==='cs'?`cs:${provider}:${rawMangaId}`:`${src}:${rawMangaId}`;
  if(!curManga||curManga.id!==fullId){
    const parts=fullId.split(':'),s=parts[0];
    let det=null;
    if(s==='md')det=await mdDetail(parts[1]);
    else if(s==='ck')det=await ckDetail(parts[1]);
    else if(s==='cs')det=await csDetail(parts[1],parts.slice(2).join(':'));
    if(det){
      curManga=det;
      let chs=[];
      if(s==='md')chs=await mdChapters(parts[1]);
      else if(s==='ck')chs=await ckChapters(parts[1]);
      else if(s==='cs')chs=await csChapters(parts[1],parts.slice(2).join(':'));
      curChapters=chs.sort((a,b)=>parseFloat(b.num||0)-parseFloat(a.num||0));
    }
  }
  const idx=curChapters.findIndex(c=>c.rawId===rawChId);
  curChIdx=idx>=0?idx:0;
  const ch=curChapters[curChIdx]||{src,rawId:rawChId,provider,num:''};
  document.getElementById('rttl').textContent=curManga?.title||'';
  document.getElementById('rci').textContent=ch.num?`Ch. ${ch.num}`:'';
  navBtns();
  await loadPages(ch);
}

function getCur(){if(vis('hp'))return'home';if(vis('bp'))return'browse';if(vis('up'))return'updates';return'home';}
function hideAll(){['hp','bp','up','dp','rp'].forEach(id=>document.getElementById(id).style.display='none');}
function goHome(){hideAll();document.getElementById('hp').style.display='block';}
function showBrowse(){
  hideAll();document.getElementById('bp').style.display='block';
  if(!document.getElementById('bg').querySelector('.mc'))loadBrowse();
}
function showUpdatesPage(){hideAll();document.getElementById('up').style.display='block';loadUpdates();}
function showReader(){hideAll();document.getElementById('rp').style.display='block';}
function goBack(){
  hideAll();
  if(prevPage==='browse'){document.getElementById('bp').style.display='block';}
  else if(prevPage==='updates'){document.getElementById('up').style.display='block';}
  else{document.getElementById('hp').style.display='block';}
}
function closeReader(){hideAll();document.getElementById('dp').style.display='block';}
function toUpdates(){
  document.querySelectorAll('.nt').forEach(t=>t.classList.remove('on'));
  document.querySelectorAll('.nt')[2].classList.add('on');
  showUpdatesPage();
}
function switchTab(tab,el){
  document.querySelectorAll('.nt').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  if(tab==='home')goHome();
  else if(tab==='browse')showBrowse();
  else showUpdatesPage();
}

/* ── KEYBOARD ───────────────────────────────────── */
document.addEventListener('keydown',e=>{
  if(vis('rp')){
    if(e.key==='ArrowRight'&&rMode==='page')nextPg();
    if(e.key==='ArrowLeft'&&rMode==='page')prevPg();
    if(e.key==='Escape')closeReader();
  }
});

/* ── INIT ───────────────────────────────────────── */
goHome();
loadHome();
</script>
</body>
</html>
